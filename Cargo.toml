[package]
name = "nimrod"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Parse and inspect Nim-compiled native binaries"
license = "Apache-2.0"
repository = "https://github.com/ATRAPSLLC/nimrod"
readme = "README.md"
keywords = ["nim", "reverse-engineering", "parser", "binary-analysis", "malware"]
categories = ["parser-implementations"]

# nimrod is used in malware-analysis pipelines where every
# input byte is adversarial. These lints prevent the parser from panicking
# on malformed input. The `cfg_attr(test, allow(...))` escape hatch in
# `src/lib.rs` lets tests still use `unwrap`/`expect`/`panic` for terseness.
# `unsafe_code` was already denied in `src/lib.rs`; preserved here.
[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"

[dependencies]
goblin = "0.10.7"
memchr = "2.8.2"

[dev-dependencies]
proptest = "1.11.0"
